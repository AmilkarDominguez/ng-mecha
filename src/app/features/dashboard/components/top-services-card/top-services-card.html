<mat-card class="top-services-card">
  <mat-card-header>
    <mat-icon mat-card-avatar class="top-services-card-icon">star</mat-icon>
    <mat-card-title>Servicios Más Solicitados</mat-card-title>
    <mat-card-subtitle>Este mes</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="top-services-card-content">
    <app-report-chart type="bar" [data]="chartData()" [options]="chartOptions" height="16rem" />
  </mat-card-content>
</mat-card>
